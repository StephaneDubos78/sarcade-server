[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "sarcade-server"
version = "0.1.0.dev0"
description = "SARCADE operational coordination server"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-only" }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
