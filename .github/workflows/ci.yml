name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -q

  demo-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start SARCADE demo stack
        working-directory: demo
        run: docker compose -f docker-compose.demo.yml up -d --build postgres server
      - name: Wait for API
        run: |
          for i in {1..40}; do
            curl -fsS http://localhost:8000/health && exit 0
            sleep 2
          done
          exit 1
      - name: Verify synchronization and logbook
        working-directory: demo
        run: docker compose -f docker-compose.demo.yml run --rm --entrypoint sh simulator -c "pip install -q httpx && python /demo/verify.py"
      - name: Verify map feature synchronisation (ADR-001)
        working-directory: demo
        run: docker compose -f docker-compose.demo.yml run --rm --entrypoint sh simulator -c "pip install -q httpx && python /demo/verify_map_features.py"
      - name: Verify the embedded web client
        run: |
          curl -fsS http://localhost:8000/ -o index.html
          grep -q "SARCADE" index.html
          curl -fsS http://localhost:8000/manifest.json | grep -q '"standalone"'
          curl -fsS http://localhost:8000/health
      - name: Logs on failure
        if: failure()
        working-directory: demo
        run: docker compose -f docker-compose.demo.yml logs
      - name: Stop stack
        if: always()
        working-directory: demo
        run: docker compose -f docker-compose.demo.yml down -v
