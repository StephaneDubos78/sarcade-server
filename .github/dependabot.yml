# Note « Mises à jour et sécurité »: security fixes as soon as published
# (Dependabot security updates, to enable in the repository settings),
# ordinary updates grouped once a week. Minor and patch updates are merged
# automatically when the CI is green (dependabot-automerge.yml); major
# versions wait for a review.
version: 2
updates:
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Paris
    groups:
      python-security:
        applies-to: security-updates
        patterns: ["*"]
      python:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Paris
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Paris
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
