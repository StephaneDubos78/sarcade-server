services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: sarcade
      POSTGRES_USER: sarcade
      POSTGRES_PASSWORD: sarcade-demo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sarcade -d sarcade"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - demo-db:/var/lib/postgresql/data

  server:
    build:
      context: ..
    environment:
      DATABASE_URL: postgresql+psycopg://sarcade:sarcade-demo@postgres:5432/sarcade
      # The demo has no Internet: weather comes from a local stub.
      SARCADE_WEATHER: "0"
      SARCADE_OPEN_METEO_URL: http://weather-stub:8080
      SARCADE_VIGILANCE_URL: http://weather-stub:8080/vigilance
      SARCADE_METEOFRANCE_API_KEY: demo
    ports:
      - "8000:8000"
    volumes:
      - demo-files:/var/lib/sarcade/files
    depends_on:
      postgres:
        condition: service_healthy
      weather-stub:
        condition: service_started
    restart: on-failure

  weather-stub:
    image: python:3.12-slim
    volumes:
      - ./weather_stub.py:/stub/weather_stub.py:ro
    command: ["python", "/stub/weather_stub.py"]

  simulator:
    image: python:3.12-slim
    working_dir: /demo
    volumes:
      - ./:/demo:ro
    environment:
      SARCADE_URL: http://server:8000
    entrypoint: ["/bin/sh", "-c"]
    command: ["pip install -q httpx && exec python /demo/simulate.py"]
    depends_on:
      - server
    profiles: ["simulate"]

volumes:
  demo-db:
  demo-files:
